<header>
  <div class="title-row">
    <h1><i class="fa-solid fa-broom"></i> <span id="appTitleText">缓存清理专家</span></h1>
    <div class="header-actions">
      <button class="lang-toggle" id="languageToggleBtn" type="button" title="切换语言" aria-label="切换语言">
        <i class="fa-solid fa-language"></i>
        <span id="languageToggleText">中文</span>
      </button>
      <button class="theme-toggle" id="themeToggleBtn" type="button" title="切换主题" aria-label="切换深浅主题">
        <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
        <span id="themeToggleText">深色</span>
      </button>
    </div>
  </div>
  <div class="domain-badge">
    <i class="fa-solid fa-globe"></i>
    <span id="currentDomain" data-i18n-placeholder="domain.scanning">正在扫描...</span>
  </div>
</header>
